<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pico Serial Test</title>
    <style>
      body {
        font-family: monospace;
        background: #111;
        color: #eee;
        padding: 20px;
      }
      button {
        font-size: 18px;
        padding: 10px 20px;
        cursor: pointer;
      }
      #log {
        margin-top: 20px;
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.5;
      }
      .err {
        color: #ff6b6b;
      }
      .ok {
        color: #4dff88;
      }
    </style>
  </head>
  <body>
    <h2>Pico Serial Test — no React, no audio, no 3D</h2>
    <p>
      This page only opens the serial port and prints what arrives. If this
      works but the main site crashes, the problem is in the app. If this
      crashes too, the problem is the Pico or the serial connection.
    </p>

    <button id="connect">Connect Pico</button>

    <div id="log"></div>

    <script>
      const logEl = document.getElementById("log");
      let lineCount = 0;

      function log(msg, cls) {
        const div = document.createElement("div");
        if (cls) div.className = cls;
        div.textContent = msg;
        logEl.appendChild(div);
        // keep the DOM small no matter how much data arrives
        while (logEl.childNodes.length > 200) {
          logEl.removeChild(logEl.firstChild);
        }
      }

      window.addEventListener("error", (e) => {
        log("UNCAUGHT ERROR: " + e.message, "err");
      });

      document.getElementById("connect").onclick = async () => {
        if (!("serial" in navigator)) {
          log("Web Serial not supported. Use Chrome or Edge.", "err");
          return;
        }

        let port;
        try {
          port = await navigator.serial.requestPort();

          const info = port.getInfo();
          if (info.usbVendorId === 0x2e8a) {
            log("Port selected: Raspberry Pi Pico (vendor 0x2E8A).", "ok");
          } else {
            log(
              "WRONG DEVICE: vendor is " +
                (info.usbVendorId
                  ? "0x" + info.usbVendorId.toString(16)
                  : "none, likely a Bluetooth port") +
                ", not a Pico (0x2E8A). It will connect but stay silent.",
              "err"
            );
          }
          await port.open({ baudRate: 115200 });
          log("Port opened.", "ok");
          try {
            await port.setSignals({
              dataTerminalReady: true,
              requestToSend: true,
            });
            log("DTR asserted. Waiting for data...", "ok");
          } catch (err) {
            log("setSignals failed: " + err.message, "err");
          }
        } catch (err) {
          log("Open failed: " + err.message, "err");
          return;
        }

        const reader = port.readable.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const started = Date.now();

        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) {
              log("Stream closed by device.", "err");
              break;
            }

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            if (buffer.length > 4096) buffer = "";

            for (const line of lines) {
              const t = line.trim();
              if (!t) continue;
              lineCount++;
              const rate = (
                lineCount /
                Math.max(1, (Date.now() - started) / 1000)
              ).toFixed(1);
              log("[" + lineCount + " total, " + rate + "/sec] " + t);
            }
          }
        } catch (err) {
          log("Read error: " + err.message, "err");
        }
      };
    </script>
  </body>
</html>
